<html lang="en">
<head>
<meta charset="utf-8">

<title>World Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#f2f5f7;--surf:#fff;--ink:#0d1b26;--mut:#5a6b78;--line:#d8e0e6;--sea:#cfe0ea;--land:#9db4c3;--hov:#0e7c86;--acc:#0e7c86;--gold:#b7791f;--c1:#0e7c86;--c2:#b7791f;--c3:#6a4fb3;--c4:#c0476b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08131c;--surf:#102230;--ink:#e8eef2;--mut:#93a6b4;--line:#1f3646;--sea:#0b1b27;--land:#27465a;--hov:#5fd0c4;--acc:#5fd0c4;--gold:#f2c14e;--c1:#5fd0c4;--c2:#f2c14e;--c3:#a899ee;--c4:#f08aa8}}
:root[data-theme="dark"]{--bg:#08131c;--surf:#102230;--ink:#e8eef2;--mut:#93a6b4;--line:#1f3646;--sea:#0b1b27;--land:#27465a;--hov:#5fd0c4;--acc:#5fd0c4;--gold:#f2c14e;--c1:#5fd0c4;--c2:#f2c14e;--c3:#a899ee;--c4:#f08aa8}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.bar{display:flex;align-items:center;gap:18px;height:62px}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.01em;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{padding:8px 13px;border-radius:999px;color:var(--mut);white-space:nowrap;font-weight:600;font-size:.95rem}
nav a:hover{color:var(--ink)}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surf);cursor:pointer;flex:none}
h1,h2,h3{line-height:1.08;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(2.3rem,6vw,4.4rem);font-weight:800}h2{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800}h3{font-size:1.1rem;font-weight:600}
.mut{color:var(--mut)}
.hero{position:relative;background:var(--sea);border-bottom:1px solid var(--line);overflow:hidden}
.hero .copy{position:absolute;inset:0 auto auto 0;z-index:3;padding:34px 20px 0 max(20px,calc((100% - 1140px)/2));max-width:760px;pointer-events:none}
.hero .copy>*{pointer-events:auto}
.hero p{max-width:44ch;margin:14px 0 18px;color:var(--mut)}
.search{position:relative;max-width:460px}
.search input{width:100%;padding:15px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surf);box-shadow:0 8px 28px rgba(0,0,0,.12)}
.sug{position:absolute;inset:calc(100% + 6px) 0 auto;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:6px;list-style:none;margin:0;z-index:9;box-shadow:0 14px 34px rgba(0,0,0,.2)}
.sug a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px}.sug a:hover{background:var(--bg)}.sug small{margin-inline-start:auto;color:var(--mut)}
#map{display:block;width:100%;height:min(74vh,640px);min-height:420px;cursor:grab;touch-action:none}
#map path{fill:var(--land);stroke:var(--sea);stroke-width:.4;transition:fill .15s}#map path:hover,#map path.on{fill:var(--hov)}
.mc{position:absolute;right:16px;bottom:16px;display:flex;gap:6px;z-index:4}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:10px;font-size:.88rem;display:none}
.pin{position:absolute;z-index:6;left:20px;bottom:16px;width:min(320px,calc(100% - 40px));background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 14px 34px rgba(0,0,0,.2);display:none}
.pin .r{display:flex;align-items:center;gap:12px;margin-bottom:8px}.pin img{width:44px;height:30px;object-fit:cover;border-radius:4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border-color:var(--line)}.btn:hover{transform:translateY(-1px)}
.sec{padding:52px 0}.row{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border-block:1px solid var(--line)}
.st{padding:22px 20px;border-inline-start:1px solid var(--line)}.st:first-child{border-inline-start:0}
.st b{display:block;font-size:1.9rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}.st span{color:var(--mut);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}.grid.list{grid-template-columns:1fr;gap:10px}
.card{display:block;background:var(--surf);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .25s,box-shadow .25s}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 16px 34px rgba(0,0,0,.16)}
.cv{position:relative;aspect-ratio:3/2;background-size:cover;background-position:center;overflow:hidden}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,.05))}
.cv img{position:absolute;z-index:2;left:14px;bottom:12px;width:52px;height:35px;object-fit:cover;border-radius:5px;box-shadow:0 2px 10px rgba(0,0,0,.45)}
.cb{padding:14px 16px 16px}.cb h3{margin-bottom:8px}
.kv{display:grid;gap:3px;font-size:.88rem}.kv div{display:flex;justify-content:space-between;gap:10px}.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:600;text-align:end}
.list .card{display:flex}.list .cv{width:200px;aspect-ratio:auto;min-height:110px;flex:none}.list .cb{flex:1}
@media(max-width:600px){.list .card{flex-direction:column}.list .cv{width:100%;aspect-ratio:16/8}}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.tools input,.tools select{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surf)}.tools input{flex:1 1 240px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg button{border:0;background:var(--surf);padding:10px 14px;cursor:pointer}.seg [aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.conts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.conts a{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surf)}.conts a:hover{border-color:var(--acc)}.conts b{display:block;font-size:1.15rem}
.cover{position:relative;min-height:340px;display:flex;align-items:flex-end;color:#fff;background-size:cover;background-position:center;overflow:hidden}
.cover::before{content:"";position:absolute;inset:0;backdrop-filter:blur(28px) saturate(1.2);background:rgba(6,14,20,.55)}
.cover .wrap{position:relative;display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;padding-block:80px 30px;width:100%}
.cover img{width:110px;border-radius:8px;box-shadow:0 8px 26px rgba(0,0,0,.5)}.cover h1{font-size:clamp(2.2rem,5vw,3.8rem)}.cover .btn{border-color:#fff;background:#fff;color:#08131c}.cover .btn.g{background:transparent;color:#fff}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surf)}
.f{padding:16px 18px;border:solid var(--line);border-width:0 1px 1px 0}.f small{display:block;color:var(--mut)}.f b{font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surf);font-size:.92rem;cursor:pointer}
.bars{display:grid;gap:10px}.bar2{display:grid;grid-template-columns:150px 1fr 90px;gap:12px;align-items:center;font-size:.92rem}
.bar2 i{display:block;height:14px;border-radius:7px;background:var(--c1);width:0;transition:width .8s cubic-bezier(.2,.7,.2,1)}.bar2 em{font-style:normal;text-align:end;font-weight:600}
@media(max-width:560px){.bar2{grid-template-columns:100px 1fr 70px}}
table{width:100%;border-collapse:collapse;background:var(--surf);border:1px solid var(--line);border-radius:14px;overflow:hidden}td,th{padding:12px 14px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}th{color:var(--mut);font-weight:600}
.x{overflow-x:auto}.empty{padding:40px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--mut)}
.note{font-size:.82rem;color:var(--mut);margin-top:14px;max-width:80ch}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mut);font-size:.85rem}
::view-transition-old(root){animation:vo .25s ease both}::view-transition-new(root){animation:vi .4s ease both}
@keyframes vo{to{opacity:0}}@keyframes vi{from{opacity:0}}
@keyframes pg{from{opacity:0;transform:translateY(16px)}}@keyframes pop{from{opacity:0}}
.pg>*{animation:pg .55s cubic-bezier(.2,.7,.2,1) both}.pg>*:nth-child(2){animation-delay:.07s}.pg>*:nth-child(3){animation-delay:.14s}
.card{animation:pg .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*40ms)}
.cv img{transition:transform .35s cubic-bezier(.2,.7,.2,1)}.card:hover .cv img{transform:scale(1.1) rotate(-2deg)}
#map path{animation:pop .7s both;animation-delay:calc(var(--d,0)*4ms)}
nav{position:relative}.ind{position:absolute;top:50%;left:0;height:34px;margin-top:-17px;border-radius:999px;background:var(--ink);transition:transform .38s cubic-bezier(.2,.7,.2,1),width .38s cubic-bezier(.2,.7,.2,1);z-index:0}
nav a{position:relative;z-index:1;transition:color .25s}nav a[aria-current="page"]{background:transparent;color:var(--bg)}
header.top.sc{box-shadow:0 8px 26px rgba(0,0,0,.1)}.btn:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chip{transition:background .2s,border-color .2s}
.eh{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}.eh p{margin:6px 0 0}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.hero .copy{animation:in .8s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:700px){.hero .copy{position:relative;padding-bottom:6px;background:var(--sea)}.hero .mc{bottom:70px}.pin{bottom:70px}}
</style>
</head>

function about(){$("#app").innerHTML=`<div class="wrap sec" style="max-width:760px"><h1 style="font-size:clamp(2rem,4vw,3rem)">About</h1><p>World Explorer covers every UN member state plus Vatican City and Palestine (${C.length} countries). Everything on screen is computed from one embedded dataset, so nothing is invented.</p><p class="mut">Sources: World Bank population (reference year shown), mledoze/countries (names, capitals, area, languages, currencies, borders), country-flag-icons (flags) and Natural Earth via world-atlas (map).</p><p class="mut">This preview has no photographs: a hosted preview cannot fetch images from other sites. Country covers use each flag instead. Real photography can be added when the site is deployed on your own hosting.</p></div>`}

/* ---------- router ---------- */
function ind(){const a=document.querySelector('nav a[aria-current]'),i=$("#ind");if(a){i.style.width=a.offsetWidth+"px";i.style.transform=`translateX(${a.offsetLeft}px)`;i.style.opacity=1}else i.style.opacity=0}
function route(){
 const h=location.hash.slice(1)||"home",[r,arg]=h.startsWith("country-")?["country",h.slice(8)]:[h];
 const run=()=>{$("#app").className="pg";
  try{({home,explore,compare,stats,about}[r]||(r==="country"?()=>country(arg):home))()}catch(e){console.error(e);$("#app").innerHTML=`<div class="wrap sec"><div class="empty">Something went wrong on this page: ${esc(e.message)}<br><br><a class="btn" href="#home">Back to home</a></div></div>`}
  document.querySelectorAll("nav a").forEach(a=>{r===a.dataset.r||(r==="country"&&a.dataset.r==="explore")?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
  document.title=(r==="country"&&by.get(arg)?by.get(arg).n+" · ":"")+"World Explorer";window.scrollTo(0,0);ind()};
 if(document.startViewTransition&&!matchMedia("(prefers-reduced-motion:reduce)").matches)document.startViewTransition(run);else run();
}
addEventListener("resize",ind);addEventListener("scroll",()=>document.querySelector("header.top").classList.toggle("sc",scrollY>8),{passive:true});
addEventListener("hashchange",route);
$("#th").onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dark?"light":"dark";try{localStorage.setItem("wx-theme",d.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem("wx-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
route();
</script>
